name: Release

# Triggered by a version tag (v0.2.0) or manually with an explicit version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.2.0'
        required: true
        type: string

permissions:
  # Required so `gh release create` can create the release and upload assets.
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    name: Build, package, publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version) {
            # Tag builds: strip the leading "v".
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Invalid release version '$version'."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.value }}

      # DoD: `dotnet test` must be green before a release is produced.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      # The released artifact is a self-contained win-x64 CLI; there is no installer
      # and no auto-updater (docs/adr/0007-cli-self-contained-distribution.md).
      - name: Publish win-x64 self-contained CLI
        run: >
          dotnet publish src/WeArchive.Cli/WeArchive.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/publish/win-x64

      - name: Assert self-contained output
        shell: pwsh
        run: |
          $exe = 'artifacts/publish/win-x64/WeArchive.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path 'artifacts/publish/win-x64/hostfxr.dll')) { throw 'not self-contained' }

      # Verifies the artifact that is about to be published, not a development build.
      - name: Smoke-test the release artifact
        shell: pwsh
        run: ./scripts/smoke-test-cli.ps1 -ExpectedVersion ${{ steps.version.outputs.value }}

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/pack-portable.ps1 -Version ${{ steps.version.outputs.value }} -SkipPublish

      - name: Determine pre-release flag
        id: prerelease
        shell: pwsh
        run: |
          # A version carrying a SemVer prerelease suffix (for example 0.2.0-rc.1) is
          # published as a GitHub pre-release, so it is clearly a test build and is never
          # picked up as the stable release of record.
          $pre = '${{ steps.version.outputs.value }}'.Contains('-')
          "value=$($pre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create the GitHub Release with the portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $ghArgs = @(
            'release', 'create', "v$version",
            'artifacts/WeArchive-win-x64.zip',
            '--title', "WeArchive $version",
            '--generate-notes'
          )
          if ('${{ steps.prerelease.outputs.value }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

      - name: Summarize release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ steps.version.outputs.value }}" --json assets `
            --jq '.assets[] | "\(.name)  \(.size) bytes"' | Tee-Object -FilePath release-assets.txt
          Get-Content release-assets.txt >> $env:GITHUB_STEP_SUMMARY
