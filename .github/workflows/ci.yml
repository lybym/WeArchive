name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one CI run per ref; a newer push supersedes an in-flight build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-and-test:
    name: Restore, build, test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Report SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # The real-WeChat adapter tests skip automatically when no local WeChat client
      # is present, so this step is green on a clean runner.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  cli-artifact:
    name: Publish and smoke-test the win-x64 CLI artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Stamped with a distinct scratch version so the artifact-version assertions below are
      # meaningful: an unstamped build would report the 0.1.0 VersionPrefix and prove nothing.
      - name: Publish self-contained win-x64 CLI
        run: >
          dotnet publish src/WeArchive.Cli/WeArchive.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=0.0.0-ci
          -o artifacts/publish/win-x64

      - name: Assert self-contained output
        shell: pwsh
        run: |
          $exe = 'artifacts/publish/win-x64/WeArchive.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          # A self-contained publish ships the runtime next to the app.
          if (-not (Test-Path 'artifacts/publish/win-x64/hostfxr.dll')) { throw 'not self-contained' }
          Write-Host "WeArchive.exe produced: $((Get-Item $exe).Length) bytes"

      # Runs against the published artifact, never a development build (Issue #9), and pins the
      # version the build was stamped with.
      - name: Smoke-test the published artifact
        shell: pwsh
        run: ./scripts/smoke-test-cli.ps1 -ExpectedVersion 0.0.0-ci

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/pack-portable.ps1 -Version 0.0.0-ci -SkipPublish

      # The ZIP is what actually ships, so its layout and the PATH shim are verified as
      # extracted rather than only as the publish folder they came from.
      - name: Smoke-test the extracted portable ZIP
        shell: pwsh
        run: ./scripts/smoke-test-package.ps1 -ExpectedVersion 0.0.0-ci

      # Convenience artifact only: the object that actually ships is produced by the
      # Release workflow and attached as a GitHub Release asset, which does not consume
      # Actions artifact storage. The artifact and extracted-ZIP smoke tests above have
      # already verified this ZIP, so a storage-quota or transport failure here must not
      # fail the job conclusion and turn main red (Issue #40).
      - name: Upload portable ZIP
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: WeArchive-win-x64-ci
          path: artifacts/WeArchive-win-x64.zip
          if-no-files-found: error
          # One day keeps the ~39 MB/upload steady state well inside the private-repo
          # storage quota even during active development; three days measured ~540 MB.
          retention-days: 1
