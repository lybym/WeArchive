[project]
name = "wearchive"
version = "0.1.0"
description = "Local-first personal chat archive toolkit"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
wearchive = "wearchive.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
